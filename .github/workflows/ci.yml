name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r backend/requirements.txt
      - run: pip install pytest
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: PYTHONPATH=backend python -m compileall -q backend/app
      - run: DATABASE_URL=sqlite:////tmp/ci-migration.db AUTO_CREATE_TABLES=false alembic -c alembic.ini upgrade head
      - run: DATABASE_URL=sqlite:////tmp/ci-migration.db AUTO_CREATE_TABLES=false alembic -c alembic.ini downgrade base
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build
